<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Premium mini-illustration: Global / Worldwide reach -->
  <!-- Style: Minimal, editorial, subtle outlines with brand accents -->
  <rect width="48" height="48" rx="8" fill="#F8F9FA"/>
  
  <!-- Globe -->
  <circle cx="24" cy="24" r="14" stroke="#E5E7EB" stroke-width="1.5" fill="white"/>
  
  <!-- Latitude lines -->
  <ellipse cx="24" cy="24" rx="14" ry="5" stroke="#E5E7EB" stroke-width="1" fill="none"/>
  <ellipse cx="24" cy="24" rx="14" ry="10" stroke="#E5E7EB" stroke-width="0.75" fill="none" stroke-dasharray="3 2"/>
  
  <!-- Longitude line -->
  <ellipse cx="24" cy="24" rx="5" ry="14" stroke="#E5E7EB" stroke-width="1" fill="none"/>
  
  <!-- Meridian -->
  <line x1="24" y1="10" x2="24" y2="38" stroke="#E5E7EB" stroke-width="0.75"/>
  
  <!-- Location pins -->
  <g transform="translate(16, 16)">
    <circle cx="0" cy="0" r="2.5" fill="#28547C"/>
    <circle cx="0" cy="0" r="1" fill="white"/>
  </g>
  <g transform="translate(30, 20)">
    <circle cx="0" cy="0" r="2.5" fill="#E67E22"/>
    <circle cx="0" cy="0" r="1" fill="white"/>
  </g>
  <g transform="translate(22, 30)">
    <circle cx="0" cy="0" r="2" fill="#28547C" opacity="0.7"/>
    <circle cx="0" cy="0" r="0.75" fill="white"/>
  </g>
  
  <!-- Connection arc -->
  <path d="M16 16Q24 12 30 20" stroke="#28547C" stroke-width="1" stroke-dasharray="2 2" fill="none" opacity="0.5"/>
  
  <!-- Decorative sparkle -->
  <circle cx="40" cy="12" r="1" fill="#E67E22" opacity="0.5"/>
</svg>
