  <circle cx="200" cy="220" r="30" fill="#28547C" opacity="0.12"/>
  <rect x="170" y="260" width="60" height="80" rx="8" fill="#28547C" opacity="0.1"/>
  <circle cx="400" cy="220" r="30" fill="#E67E22" opacity="0.12"/>
  <rect x="370" y="260" width="60" height="80" rx="8" fill="#E67E22" opacity="0.1"/>
